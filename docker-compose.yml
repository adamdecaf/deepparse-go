services:
  deepparse:
    image: ghcr.io/graal-research/deepparse:0.11.0
    command: uvicorn deepparse.app.app:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')",
        ]
      interval: 15s
      start_period: 180s
      timeout: 10s
      retries: 40
    ports:
      - "8000:8000"
    volumes:
      - "./data:/home/appuser/.cache"
    environment:
      HF_HOME: /home/appuser/.cache/huggingface
      TRANSFORMERS_CACHE: /home/appuser/.cache/huggingface
      SENTRY_DSN: ${SENTRY_DSN:-}
