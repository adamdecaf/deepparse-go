name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: Tests
        run: go test -short -count=1 ./...

      - name: Vet
        run: go vet ./...

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ./data
          key: ${{ runner.os }}-deepparse-0.11.0
          restore-keys: |
            ${{ runner.os }}-deepparse-

      - name: Start deepparse
        run: |
          mkdir -p data
          chmod 777 data
          docker compose up -d

      - name: Wait for deepparse
        run: ./scripts/health-containers.sh

      - name: Live API tests
        run: go test -count=1 -v -run 'TestIntegration' ./...
        env:
          DEEPPARSE_URL: http://localhost:8000

      - name: Go linters and coverage
        run: make check
        env:
          DEEPPARSE_URL: http://localhost:8000

      - name: Deepparse logs
        if: failure()
        run: docker compose ps && docker compose logs
